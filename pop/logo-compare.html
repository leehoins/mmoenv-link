<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>m.moenv 로고 시안 비교</title>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Geist+Mono&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; padding: 40px 24px 80px; background: #f8fff3; font-family: "Geist Mono", monospace; color: #17141f; }
      h1 { margin: 0 0 32px; font: 400 28px "Bagel Fat One", sans-serif; text-align: center; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; max-width: 1280px; margin: 0 auto; }
      .opt { padding: 36px 28px 28px; border: 1.5px solid #17141f; border-radius: 28px; background: #fff; }
      .opt h2 { margin: 0 0 20px; font: 400 20px "Bagel Fat One", sans-serif; }
      .opt .c-puff { display: block; line-height: 0; }
      .opt svg { width: 100%; height: auto; overflow: visible; }
      .opt a { display: inline-block; margin-top: 18px; padding: 8px 16px; border: 1.5px solid #17141f; border-radius: 999px; color: inherit; text-decoration: none; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>로고 시안 비교</h1>
    <div class="grid">
      <section class="opt"><h2>A. 글자별 파스텔 풍선</h2><span class="c-puff" data-logo="a" data-variant="pastel"></span><a href="./?logo=pastel&amp;opening=1">A안으로 전체 보기 →</a></section>
      <section class="opt"><h2>B. 검정 광택 풍선</h2><span class="c-puff" data-logo="b" data-variant="black"></span><a href="./?logo=black&amp;opening=1">B안으로 전체 보기 →</a></section>
    </div>
    <script src="pop.js"></script>
  </body>
</html>
